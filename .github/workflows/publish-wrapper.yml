name: Release wrapper (pm-server) to PyPI

# The `pm-server` distribution is a thin compatibility wrapper that depends on
# `pmlens` (the real package, published by release.yml). Since the Phase-2 rename
# the repo ROOT is `pmlens`, so release.yml only publishes pmlens — the wrapper
# lost its automated publish path. This workflow restores it via OIDC Trusted
# Publishing, so no local PyPI API token is ever needed (matches the .pypirc
# hygiene decision of 2026-05-19). PMSERV-137 Phase-3 / step 7.
#
# Triggers:
#   - push of a v* tag  → publishes the wrapper for that release (auto, future).
#   - workflow_dispatch → one-off / backfill (e.g. the current 0.12.0). Run it
#     from `main` (where this file lives); it builds the wrapper at the version
#     committed on that ref. main already carries the latest wrapper version, so
#     no ref input is needed (and untrusted input in checkout `ref:` is avoided).
#
# PyPI setup (one-time, done by a maintainer on pypi.org):
#   pm-server project → Settings → Publishing → Add a GitHub trusted publisher:
#     Owner=flc-design  Repository=pmlens
#     Workflow=publish-wrapper.yml  Environment=pypi

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

# See release.yml: never cancel a run that may already have uploaded to PyPI.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build wrapper distributions
    runs-on: ubuntu-latest
    outputs:
      # Read from the wrapper's own pyproject rather than the tag, so the
      # ordering gate in `publish` also works on a workflow_dispatch backfill,
      # where ref_name is a branch and carries no version.
      version: ${{ steps.wrapper_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      # The v0.12.1 incident in reverse: there, the wrapper was STALE relative
      # to the tag and PyPI rejected it loudly. `skip-existing: true` below now
      # swallows that rejection, so an unbumped wrapper would republish nothing
      # and still go green. Assert the pairing instead. Skipped on
      # workflow_dispatch, where ref_name is a branch, not a version.
      - name: Tag name must match the wrapper's version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected="${TAG#v}"; expected="${expected%%-*}"
          actual="$(python -c 'import tomllib;print(tomllib.load(open("packaging/pm-server-wrapper/pyproject.toml","rb"))["project"]["version"])')"
          if [ "$expected" != "$actual" ]; then
            echo "::error::tag $TAG expects wrapper version $expected but the tagged tree has $actual"
            exit 1
          fi
          echo "tag $TAG matches wrapper $actual"

      - name: Read the wrapper version
        id: wrapper_version
        run: |
          set -euo pipefail
          v="$(python -c 'import tomllib;print(tomllib.load(open("packaging/pm-server-wrapper/pyproject.toml","rb"))["project"]["version"])')"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "wrapper version: $v"

      - name: Build wrapper sdist + wheel
        run: python -m build packaging/pm-server-wrapper --outdir wrapper-dist

      - name: Validate distributions
        run: |
          ls -la wrapper-dist/
          test -n "$(ls wrapper-dist/*.whl 2>/dev/null)"
          test -n "$(ls wrapper-dist/*.tar.gz 2>/dev/null)"
          twine check wrapper-dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wrapper-dist
          path: wrapper-dist/
          if-no-files-found: error

  publish:
    # Named to pair with release.yml's "approval 1 of 2" — see PMSERV-173.
    name: Publish pm-server wrapper to PyPI (approval 2 of 2)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pm-server/
    permissions:
      id-token: write       # OIDC required for PyPI Trusted Publisher
      attestations: write   # PEP 740 provenance attestation
    steps:
      # The inverse half of the gate in release.yml, and the one that closes a
      # PERMANENT window rather than a recoverable one. This wrapper declares
      # `pmlens>=X.Y.Z`; publishing it before pmlens X.Y.Z exists leaves
      # `uvx pm-server@X.Y.Z` unresolvable, and if the pmlens run's `verify`
      # then fails, the release can never be completed at that version — PyPI
      # does not allow re-uploading a filename. So: pmlens first, always.
      - name: Require pmlens on PyPI before publishing the wrapper
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${VERSION:-}" ]; then
            echo "::error::the build job did not export a wrapper version; refusing to publish blind"
            exit 1
          fi
          url="https://pypi.org/pypi/pmlens/${VERSION}/json"
          # Same schedule and the same two curl subtleties as release.yml.
          attempts=10
          for attempt in $(seq 1 "$attempts"); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
                      --max-time 20 --retry 2 --retry-max-time 40 --retry-connrefused \
                      -H 'Accept: application/json' "$url")" || code=000
            if [ "$code" = "200" ]; then
              echo "pmlens ${VERSION} is on PyPI (poll ${attempt})"
              exit 0
            fi
            echo "poll ${attempt}/${attempts}: HTTP ${code} for ${url}"
            [ "$attempt" -lt "$attempts" ] && sleep $((attempt * 15))
          done
          echo "::error::pmlens ${VERSION} is not on PyPI after 10 polls (~11 minutes). Approve 'Release to PyPI' (approval 1 of 2) FIRST, then re-run this job. Publishing this wrapper now would ship a metapackage whose pmlens>=${VERSION} floor cannot resolve. See docs/RELEASING.md."
          exit 1

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: wrapper-dist
          path: wrapper-dist/

      - name: Publish wrapper to PyPI via Trusted Publisher
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # v1.14.1
        with:
          packages-dir: wrapper-dist/
          # Idempotent republish (see release.yml) — the pypi environment
          # only deploys from v* tags, so wrapper-only fixes re-fire BOTH
          # workflows via a new tag; the pmlens side then no-ops.
          skip-existing: true
