name: Release to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Never cancel a run that may already have uploaded to PyPI — a re-tagged
# correction must queue behind its predecessor, not race it. Grouping per
# workflow+ref also keeps a mistaken-then-corrected tag pair from stacking up
# four indistinguishable approval prompts across the two release workflows.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    # Gate the irreversible publish on the TAGGED commit (2026-07-25). Two gaps
    # made a bad tag ship silently: ci.yml has no tag trigger, so nothing tested
    # what was actually tagged; and `skip-existing: true` below — added after the
    # v0.12.1 wrapper incident — turns a tag/version mismatch from a loud PyPI
    # "400 File already exists" into a green no-op that publishes nothing while
    # the Release page announces a new version. Both are fail-fast here instead.
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      - name: Tag name must match the tagged tree's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # v0.13.0 -> 0.13.0; a wrapper-republish tag v0.12.1-wrapper.1 -> 0.12.1
          expected="${TAG#v}"; expected="${expected%%-*}"
          actual="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$expected" != "$actual" ]; then
            echo "::error::tag $TAG expects version $expected but the tagged tree has $actual — the version bump is probably uncommitted"
            exit 1
          fi
          echo "tag $TAG matches pyproject $actual"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Format check with ruff
        run: ruff format --check src/ tests/

      - name: Run tests
        run: pytest -q

  build:
    name: Build distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Validate distributions
        run: |
          ls -la dist/
          test -n "$(ls dist/*.whl 2>/dev/null)"
          test -n "$(ls dist/*.tar.gz 2>/dev/null)"
          twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    # A v* tag fires TWO workflows, each with its own `pypi` environment gate,
    # and both jobs used to be called "Publish … to PyPI (Trusted Publisher)".
    # Two identically-named prompts is how a maintainer approves one and walks
    # away. The names now say which is which, and in which order (PMSERV-173).
    name: Publish pmlens to PyPI (approval 1 of 2)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pmlens/
    permissions:
      id-token: write       # OIDC required for PyPI Trusted Publisher
      attestations: write   # PEP 740 provenance attestation
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI via Trusted Publisher
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          # Idempotent republish: a re-fired tag run must not fail on files
          # already uploaded (e.g. re-tagging to republish the pm-server
          # wrapper after its version-lockstep miss at v0.12.1).
          skip-existing: true

  pack-mcpb:
    name: Pack Claude Desktop/Cowork .mcpb bundle (PMSERV-083)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      - name: Validate manifest and build bundle
        run: python scripts/build_mcpb.py

      - name: Upload .mcpb bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mcpb-bundle
          path: dist/pmlens-*.mcpb
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    # Release-page automation (2026-07-20): v0.11.0–v0.12.1 shipped to PyPI
    # with no Release page entry, leaving "Latest v0.10.0" stale for weeks.
    # Runs only after the PyPI publish succeeded, and only for plain vX.Y.Z
    # tags — wrapper-republish tags (e.g. v0.12.1-wrapper.1) also match the
    # v* trigger but must not get a Release entry.
    if: ${{ !contains(github.ref_name, '-') }}
    needs: [publish, pack-mcpb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      # The Release page is the announcement. Do not announce a version whose
      # committed plugin pin cannot resolve. `publish-wrapper.yml` runs as a
      # SEPARATE workflow with its own approval, so approving only this one
      # publishes pmlens, creates a `--latest` Release, and leaves
      # `uvx pm-server@X.Y.Z` (plugin/.mcp.json) unresolvable for every plugin
      # user — with no job red anywhere. This turns that into a loud failure
      # (PMSERV-173).
      - name: Require the pm-server wrapper on PyPI before announcing
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"; version="${version%%-*}"
          url="https://pypi.org/pypi/pm-server/${version}/json"
          # 10 attempts, backoff 15s..150s => ~13.75 min. PyPI index propagation
          # is normally well under a minute; the budget is sized for a human
          # approving the second run a few minutes late, not for the CDN.
          for attempt in $(seq 1 10); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
                      --max-time 20 --retry 2 --retry-connrefused \
                      -H 'Accept: application/json' "$url" || echo 000)"
            if [ "$code" = "200" ]; then
              echo "pm-server ${version} is on PyPI (attempt ${attempt})"
              exit 0
            fi
            echo "attempt ${attempt}: HTTP ${code} for ${url}"
            sleep $((attempt * 15))
          done
          echo "::error::pm-server ${version} is not on PyPI after ~14 minutes. The wrapper run ('Release wrapper (pm-server) to PyPI') is probably still awaiting its own environment approval — approve it, then re-run this job. See docs/RELEASING.md."
          exit 1

      - name: Download .mcpb bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: mcpb-bundle
          path: mcpb/

      - name: Create Release from the annotated tag (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          # %(contents:*) is only meaningful for an ANNOTATED tag. On a
          # lightweight tag it resolves to the COMMIT message, which would
          # publish the commit subject and its trailers (Co-Authored-By etc.)
          # as the public release notes. Detect the object type instead of
          # trusting the format string.
          if [ "$(git cat-file -t "refs/tags/$TAG")" = "tag" ]; then
            title="$(git tag -l --format='%(contents:subject)' "$TAG")"
            git tag -l --format='%(contents:body)' "$TAG" > notes.md
          else
            echo "::warning::$TAG is a lightweight tag — falling back to the CHANGELOG pointer instead of the commit message"
            title=""
            : > notes.md
          fi
          test -s notes.md || echo "See CHANGELOG.md for details." > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — skipping"
          else
            gh release create "$TAG" mcpb/pmlens-*.mcpb --verify-tag --latest \
              --title "${title:-$TAG}" --notes-file notes.md
          fi
